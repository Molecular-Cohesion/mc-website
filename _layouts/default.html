---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#0d9488',
                        'accent-hover': '#0f766e',
                        dark: '#0f172a',
                        slate: { 700: '#334155', 500: '#64748b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-slate-700 bg-white">

    <!-- NAVIGATION -->
    <header class="bg-dark sticky top-0 z-50">
        <nav class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="text-white text-xl font-bold tracking-tight">Molecular Cohesion</a>
            
            <!-- Desktop Nav -->
            <div class="hidden md:flex space-x-8">
                {% for item in site.nav %}
                    <a href="{{ item.url | relative_url }}" class="text-slate-500 hover:text-white transition-colors text-sm font-medium {% if page.url == item.url %}text-white border-b-2 border-accent pb-1{% endif %}">{{ item.name }}</a>
                {% endfor %}
            </div>

            <!-- Mobile Hamburger -->
            <button class="md:hidden text-white" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </nav>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden bg-dark px-6 pb-4 space-y-3">
            {% for item in site.nav %}
                <a href="{{ item.url | relative_url }}" class="block text-slate-500 hover:text-white transition-colors text-sm font-medium">{{ item.name }}</a>
            {% endfor %}
        </div>
    </header>

    <!-- MAIN CONTENT INJECTION -->
    <main>
        {{ content }}
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-slate-500 text-center text-sm py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-6">
            &copy; {{ 'now' | date: '%Y' }} Molecular Cohesion. All rights reserved.
        </div>
    </footer>

</body>
</html>
