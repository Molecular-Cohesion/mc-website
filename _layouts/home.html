---
layout: default
---
<!-- Hero Section -->
<section class="bg-dark text-white py-24 md:py-32">
    <div class="max-w-6xl mx-auto px-6">
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight leading-tight max-w-3xl">
            {{ page.hero_title | default: site.title }}
        </h1>
        <p class="mt-6 text-lg md:text-xl text-slate-500 max-w-2xl leading-relaxed">
            {{ page.hero_subtitle | default: site.description }}
        </p>

    </div>
</section>

<!-- Page Content (Markdown goes here) -->
<section class="py-20">
    <div class="max-w-6xl mx-auto px-6">
        {{ content }}
    </div>
</section>
