---
layout: default
---
<!-- Page Header -->
<section class="bg-slate-100 border-b border-gray-200 py-16">
    <div class="max-w-6xl mx-auto px-6">
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-dark">{{ page.title }}</h1>
    </div>
</section>

<!-- Page Content (Markdown goes here) -->
<section class="py-16">
    <div class="max-w-4xl mx-auto px-6 prose prose-lg prose-slate">
        <!-- Prose classes automatically style your markdown (h2s, ps, lists, etc) beautifully -->
        {{ content }}
    </div>
</section>
